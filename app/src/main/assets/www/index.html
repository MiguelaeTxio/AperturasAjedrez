<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AperturasAjedrez</title>
<link rel="stylesheet" href="css/chessboard.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div id="lineName"></div>
  <div id="variantBadge" style="display:none"></div>
  <div id="overview"></div>
  <div id="progress"></div>
  <div id="sessionProgress"></div>
  <div id="turnLabel"></div>
  <div id="board"></div>
  <div id="status"></div>
  <div id="explain"></div>
  <div id="navBar">
    <button id="navFirstBtn" type="button" title="Primero">|◀</button>
    <button id="navPrevBtn" type="button" title="Anterior">◀</button>
    <input id="navNumberInput" type="number" min="1" inputmode="numeric">
    <span id="navTotal"></span>
    <button id="navGoBtn" type="button">Ir</button>
    <button id="navNextBtn" type="button" title="Siguiente">▶</button>
    <button id="navLastBtn" type="button" title="Ultimo">▶|</button>
    <button id="navFavBtn" type="button" title="Marcar favorito">☆</button>
    <button id="navFavListBtn" type="button">Favoritos</button>
  </div>
  <button id="restartBtn" type="button">Reiniciar linea</button>
</div>

<script src="js/jquery-3.4.1.min.js"></script>
<script src="js/chessboard.js"></script>
<script src="js/chess.js"></script>
<script src="js/repertoire.js"></script>
<script src="js/repertoire_tree.js"></script>
<script src="js/finales.js"></script>
<script src="js/problemas.js"></script>
<script src="js/estructuras.js"></script>
<script src="js/game.js"></script>
</body>
</html>
